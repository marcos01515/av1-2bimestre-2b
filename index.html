<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Av1 DWB - Rick and Morty Explorer</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EO2M6lzG6eJXZ3Z9e3cgWlgasUTKp7xKh8Qj6Dfq38hFrjUjce1IhrqW3jQN8Y3r" crossorigin="anonymous">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="bg-gradient text-white py-5 mb-4">
    <div class="container">
      <div class="d-md-flex justify-content-between align-items-center gap-3">
        <div>
          <h1 class="display-6 fw-bold mb-2">Rick and Morty Explorer</h1>
          <p class="lead mb-0">Busque, filtre e navegue por personagens do universo Rick and Morty.</p>
        </div>
        <div class="text-md-end">
          <span class="badge bg-info text-dark fs-6">Fetch API · Bootstrap 5 · JavaScript</span>
        </div>
      </div>
    </div>
  </header>

  <main class="container">
    <section class="row gx-4 gy-3 mb-4">
      <div class="col-lg-8">
        <form id="search-form" class="input-group shadow-sm">
          <input id="search-input" type="search" class="form-control" placeholder="Buscar por nome do personagem..." aria-label="Buscar por nome">
          <button class="btn btn-primary" type="submit">Buscar</button>
        </form>
      </div>
      <div class="col-lg-4">
        <div class="d-flex gap-2">
          <select id="status-filter" class="form-select">
            <option value="">Status</option>
            <option value="alive">Vivo</option>
            <option value="dead">Morto</option>
            <option value="unknown">Desconhecido</option>
          </select>
          <select id="gender-filter" class="form-select">
            <option value="">Gênero</option>
            <option value="female">Feminino</option>
            <option value="male">Masculino</option>
            <option value="genderless">Sem gênero</option>
            <option value="unknown">Desconhecido</option>
          </select>
        </div>
      </div>
      <div class="col-12">
        <div class="d-flex flex-column flex-md-row justify-content-between align-items-start align-items-md-center gap-3">
          <div id="info-panel" class="text-muted small"></div>
          <button id="clear-filters" type="button" class="btn btn-outline-secondary">Limpar filtros</button>
        </div>
      </div>
    </section>

    <section id="feedback" class="mb-4"></section>
    <div id="card-grid" class="row g-3"></div>
    <nav id="pagination-controls" class="mt-4 d-flex flex-wrap justify-content-between align-items-center"></nav>
  </main>

  <div class="modal fade" id="episodes-modal" tabindex="-1" aria-labelledby="episodesModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-lg">
      <div class="modal-content rounded-4 shadow">
        <div class="modal-header border-0">
          <div>
            <h5 class="modal-title" id="episodesModalLabel">Episódios</h5>
            <p class="text-muted small mb-0" id="episodes-modal-subtitle"></p>
          </div>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
        </div>
        <div class="modal-body" id="episodes-modal-body"></div>
        <div class="modal-footer border-0">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Fechar</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-BeZ0qf7H5KpAdvtw8yxnFujK2qQWQ8K7R0tKI9h8MRVv0gyq6k5qcQmSOBJmPVda" crossorigin="anonymous"></script>
  <script src="js/script.js"></script>
</body>
</html>
